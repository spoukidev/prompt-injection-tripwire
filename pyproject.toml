[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-injection-tripwire"
version = "0.1.0"
description = "Interception proxy that detects indirect prompt injection in tool-using LLM agents (canaries, taint tracking, exfil detection, YAML policy) plus an on/off benchmark."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "httpx>=0.27", "rapidfuzz>=3.6", "pyyaml>=6",
  "sqlmodel>=0.0.16", "scikit-learn>=1.4", "joblib>=1.3", "numpy>=1.26", "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6.100"]
dashboard = ["streamlit>=1.40"]
ml = ["torch", "transformers>=4.44", "datasets>=2.20", "accelerate>=0.33", "pyarrow"]

[tool.setuptools.packages.find]
include = ["tripwire*", "agent*", "attacks*", "classifier*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
